[project]
name = "whale-alpha"
version = "0.2.0"
description = "Solana whale-wallet tracking Telegram bot with signal-driven auto trading (Python port)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.7,<4",
    "solders>=0.21,<1",
    "solana>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "redis[hiredis]>=5.0,<6",
    "arq>=0.26,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "cryptography>=42.0,<44",
    "structlog>=24.1,<25",
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
    "anthropic>=0.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501", "I001", "UP007", "UP017", "UP035", "UP037", "UP042", "UP046"]
per-file-ignores = { "scripts/validation/validate_fallback_chain.py" = ["E402"], "scripts/validation/validate_http_retry.py" = ["E402"], "scripts/validation/validate_rpc_swap_parser.py" = ["E402"], "tests/unit/test_wallet_discovery_source.py" = ["E402"] }

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["whale_alpha"]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = false
